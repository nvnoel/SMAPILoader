name: Build APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.312'

    - name: Install Android Workload
      run: dotnet workload install android

    - name: Create Dummy DLLs
      run: |
        DUMMY_DIR="$GITHUB_WORKSPACE/../SMAPI-Android-1.6/src/DependenciesDll"
        mkdir -p "$DUMMY_DIR"
        mkdir -p /tmp/dummy_dlls/stardew
        mkdir -p /tmp/dummy_dlls/monogame
        mkdir -p /tmp/dummy_dlls/gamedata

        cat << 'EOF' > /tmp/dummy_dlls/stardew/StardewValley.cs
        #nullable disable
        namespace StardewValley {
            public class MainActivity {
                public void CheckStorageMigration() {}
            }
            public class Game1 {
                public static Game1 game1;
                public static int xEdge;
                public static int toolbarPaddingX;
                public void OnAppResume() {}
                public void OnAppPause() {}
                public static void emergencyBackup() {}
            }
            public class TitleContainer { public static System.IO.Stream OpenStream(string name) { return null; } }
            public class GameRunner {
                public static GameRunner instance;
                public void Run() {}
                public Android.Content.Context Services { get; set; }
            }
        }
        namespace StardewValley.Audio { public class Dummy {} }
        namespace StardewValley.Network { public class Dummy {} }
        namespace Android.Content {
            public class Context {
                public object GetService(string name) { return null; }
            }
        }
        EOF

        cat << 'EOF' > /tmp/dummy_dlls/monogame/MonoGame.Framework.cs
        #nullable disable
        using System;
        namespace Microsoft.Xna.Framework {
            public class Game {}
            public class AndroidGameActivity : Android.App.Activity {}
        }
        namespace Microsoft.Xna.Framework.Graphics { public class SpriteBatch {} }
        namespace Microsoft.Xna.Framework.Content { public class ContentManager {} }
        namespace Microsoft.Xna.Framework.Audio {
            public class Dummy {}
            public class AudioEngine {}
            public class AudioCategory { public string Name { get; set; } }
        }
        namespace MonoGame.Framework.Utilities {
            public class FuncLoader { public static IntPtr LoadLibrary(string lib) { return IntPtr.Zero; } }
        }
        namespace MonoGame.OpenGL { public class Dummy {} }
        namespace MonoGame.OpenAL { public class Dummy {} }
        namespace LWJGL.Util { public class Dummy {} }
        namespace LZ4 {
            public class LZ4Codec { public static int CompressBound(int size) { return size; } }
        }
        EOF

        cat << 'EOF' > /tmp/dummy_dlls/gamedata/StardewValley.GameData.cs
        namespace StardewValley.GameData { public class Dummy {} }
        EOF

        cat << 'EOF' > /tmp/dummy_dlls/stardew/StardewValley.csproj
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net9.0-android</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>enable</Nullable>
          </PropertyGroup>
        </Project>
        EOF

        cat << 'EOF' > /tmp/dummy_dlls/monogame/MonoGame.Framework.csproj
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net9.0-android</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>enable</Nullable>
          </PropertyGroup>
        </Project>
        EOF

        cat << 'EOF' > /tmp/dummy_dlls/gamedata/StardewValley.GameData.csproj
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net9.0-android</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>enable</Nullable>
          </PropertyGroup>
        </Project>
        EOF

        cd /tmp/dummy_dlls/stardew
        dotnet build -c Release
        cp bin/Release/net9.0-android/StardewValley.dll "$DUMMY_DIR/StardewValley.dll"

        cd ../monogame
        dotnet build -c Release
        cp bin/Release/net9.0-android/MonoGame.Framework.dll "$DUMMY_DIR/MonoGame.Framework.dll"

        cd ../gamedata
        dotnet build -c Release
        cp bin/Release/net9.0-android/StardewValley.GameData.dll "$DUMMY_DIR/StardewValley.GameData.dll"

    - name: Build APK (Release, android-arm64)
      run: dotnet build SMAPIGameLoader/SMAPIGameLoader.csproj -c Release -p:RuntimeIdentifier=android-arm64

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: smapi-launcher-apk
        path: SMAPIGameLoader/bin/Release/net9.0-android/android-arm64/*-Signed.apk
